<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Basket | StudyHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html#top" aria-label="StudyHub home"><img class="brand-logo" src="assets/img/studylogo.png" alt="StudyHub logo" /></a>
      <nav>
        <a href="index.html#packages">Bundles</a>
        <a href="free.html">Free</a>
        <a href="index.html#contact" class="btn btn-sm btn-primary">Contact</a>
        <a href="cart.html" class="btn btn-sm btn-secondary" aria-label="Basket">
          Basket <span data-cart-count class="badge" style="margin-left:8px;display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="detail-main">
    <section class="section">
      <div class="container">
        <div class="detail-layout">
          <section class="detail-panel card-surface">
            <span class="eyebrow">Basket</span>
            <h2>Your selected bundles</h2>
            <p class="product-note">Add multiple bundles, then pay once.</p>
            <div id="cartList"></div>
            <div class="detail-actions">
              <button class="btn btn-secondary" id="clearCartBtn" type="button">Clear basket</button>
              <a class="btn btn-primary" id="checkoutAllBtn" href="checkout.html?cart=1">Checkout all</a>
            </div>
            <p id="cartStatus" class="product-note" style="margin-top:12px"></p>
          </section>
          <aside class="detail-panel card-surface product-sidebar">
            <h3>Summary</h3>
            <div class="product-price" id="cartTotal">—</div>
            <div class="product-note">Total updates from live catalog. If offline, total may show as “—”.</div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="cart-core.js"></script>
  <script src="cart.js"></script>
</body>
</html>
