<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>StudyHub Basket</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .basket-item{padding:14px;border:1px solid #1f2937;border-radius:14px;background:#0f172a;margin-bottom:12px}
    .basket-row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .basket-qty{width:90px}
  </style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html#top" aria-label="StudyHub home">
      <img class="brand-logo" src="assets/img/studylogo.png" alt="StudyHub logo" />
    </a>
    <nav>
      <a href="index.html#packages">Bundles</a>
      <a href="basket.html">Basket <span id="basketCount">(0)</span></a>
      <a href="index.html#contact" class="btn btn-sm btn-primary">Contact</a>
    </nav>
  </div>
</header>

<main class="detail-main">
  <section class="section">
    <div class="container">
      <a class="back-link" href="index.html#packages">← Back to bundles</a>

      <h2>🧺 Basket</h2>

      <div id="items"></div>

      <div class="card-surface" style="padding:16px;border-radius:16px">
        <div class="basket-row">
          <strong>Total</strong>
          <span id="total">—</span>
        </div>

        <div class="basket-row" style="margin-top:12px">
          <button class="btn btn-primary" id="toCheckout" type="button">Proceed to Checkout</button>
          <button class="btn btn-ghost" id="clearCart" type="button">Clear</button>
        </div>

        <p class="product-note" id="note"></p>
      </div>
    </div>
  </section>
</main>

<!-- optional but recommended for consistency -->
<script src="config.js"></script>

<!-- REQUIRED -->
<script src="assets/cart.js"></script>
