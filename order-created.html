<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Order Created | StudyHub</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="detail-main">
    <section class="section">
      <div class="container">
        <div class="detail-panel card-surface" style="max-width:760px;margin:0 auto;">
          <span class="eyebrow">Order</span>
          <h2>Your order has been created</h2>
          <p>This page is only a compatibility fallback. If you are not redirected, return to checkout and use <strong>Continue to PayFast</strong>.</p>
          <div class="detail-actions">
            <a class="btn btn-primary" href="checkout.html">Back to checkout</a>
            <a class="btn btn-secondary" href="index.html#packages">Back to bundles</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const qs = new URLSearchParams(window.location.search);
    const sku = qs.get('sku');
    if (sku) setTimeout(() => { window.location.href = 'checkout.html?sku=' + encodeURIComponent(sku); }, 1200);
  </script>
</body>
</html>
