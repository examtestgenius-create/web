<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />

  <title>StudyHub Order Created</title>
</head>
<body>
  <main class="detail-main"><section class="section"><div class="container"><div class="detail-panel card-surface" style="max-width:720px;margin:0 auto;"><span class="eyebrow">Order created</span><h2>Your StudyHub order has been created</h2><p id="successMessage">Your order is captured. If PayFast is configured, the checkout page will redirect to PayFast next.</p><div class="detail-actions"><a class="btn btn-primary" href="index.html#packages">Back to bundles</a><a class="btn btn-secondary" href="index.html#contact">Contact support</a></div></div></div></section></main>
  <script>
    const params = new URL(window.location.href).searchParams;
    const orderId = params.get('order');
    const sku = params.get('sku');
    if (orderId) {
      document.getElementById('successMessage').textContent = `Order ${orderId}${sku ? ' for ' + sku : ''} has been captured.`;
    }
  </script>
</body>
</html>
