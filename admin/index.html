<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyHub Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<header><div><strong>StudyHub Admin</strong><small>Orders, payments and delivery</small></div><a href="../index.html">Open website</a></header>
<main><section class="connect-panel"><label>Apps Script API URL<input id="api" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Admin token<input id="token" type="password" placeholder="ADMIN_API_TOKEN"></label><button id="connect">Connect</button></section>
<section id="stats" class="stats"></section>
<section class="toolbar"><input id="search" placeholder="Search order, email, SKU or status"><select id="statusFilter"><option value="ALL">All payment statuses</option><option>PENDING</option><option>COMPLETE</option><option>MANUAL_PAID</option><option>CANCELLED</option><option>ITN_FAILED</option></select><button id="refresh">Refresh</button></section>
<div id="message" class="message">Connect to load orders.</div><section id="orders" class="orders"></section></main>
<script src="../config.js"></script><script src="admin.js"></script></body></html>
