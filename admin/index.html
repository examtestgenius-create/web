<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyHub Admin</title><style>body{margin:0;font-family:Arial;background:#0b1220;color:white;display:grid;place-items:center;min-height:100vh}.card{background:#111827;padding:30px;border-radius:22px;max-width:560px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}a{display:inline-block;margin-top:20px;background:#0b5fff;color:white;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800}input{width:100%;padding:12px;border-radius:10px;border:0;margin-top:12px}</style></head><body><div class="card"><h1>StudyHub Admin</h1><p>This admin opens through the secure Apps Script Web Admin login.</p><input id="url" placeholder="Paste WEBAPP_URL?page=admin here"><a href="#" onclick="go()">Open Admin</a><p style="color:#94a3b8;font-size:13px">Tip: after deployment, replace this file's link with your real Apps Script admin URL.</p></div><script>function go(){const u=document.getElementById('url').value.trim(); if(u) location.href=u; else alert('Paste WEBAPP_URL?page=admin');}</script></body></html>
