<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyHub Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">StudyHub<br>Admin</div>
      <nav class="nav">
        <a href="#" class="active" data-page="dashboard">Dashboard</a>
        <a href="#" data-page="orders">Orders</a>
        <a href="#" data-page="queue">Queue</a>
        <a href="#" data-page="scanner">Scanner</a>
        <a href="#" data-page="downloads">Downloads</a>
        <a href="#" data-page="bundles">Bundles</a>
        <a href="#" data-page="zips">ZIP Delivery</a>
        <a href="#" data-page="catalog">Catalog</a>
        <a href="#" data-page="diagnostics">Diagnostics</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="title">Dashboard</h1>
          <p id="apiStatus" class="muted">Connecting to StudyHub backend…</p>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="refreshBtn">Refresh</button>
          <a class="btn ghost" href="../index.html">Public Site</a>
        </div>
      </div>
      <section id="content"></section>
    </main>
  </div>
  <script src="../config.js"></script>
  <script src="admin.js"></script>

</html>
