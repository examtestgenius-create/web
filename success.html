<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Successful | StudyHub</title>
  <meta name="description" content="Payment confirmation page for StudyHub." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="detail-main">
    <section class="section">
      <div class="container">
        <div class="detail-panel card-surface" style="max-width:760px;margin:0 auto;">
          <span class="eyebrow">Payment</span>
          <h2>Payment successful</h2>
          <p>Order reference: <strong id="orderRef">Pending</strong></p>
          <p id="successStatus" class="warning">Confirming your order with the backend…</p>
          <div id="deliveryBlock" class="hidden" style="display:none; margin-top:16px;">
            <p><strong>Download:</strong> <a id="deliveryLink" href="#" target="_blank" rel="noopener">Open delivery link</a></p>
            <p><strong>Invoice:</strong> <a id="invoiceLink" href="#" target="_blank" rel="noopener">Open invoice</a></p>
          </div>
          <div class="detail-actions">
            <a class="btn btn-primary" href="index.html#packages">Back to bundles</a>
            <a class="btn btn-secondary" href="index.html#contact">Need help?</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="success.js"></script>
</body>
</html>
