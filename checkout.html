<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | StudyHub</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a href="index.html"><img src="assets/img/studylogo.png" class="brand-logo" alt="StudyHub"></a><nav><a href="index.html#bundles">Bundles</a><a href="index.html#how">How it works</a></nav></div></header><main class="section"><div class="container"><a class="back-link" href="index.html#bundles">← Back to bundles</a><div class="checkout-grid"><section class="checkout-card"><span class="eyebrow">Secure checkout</span><h1 id="checkoutTitle">Loading checkout...</h1><p id="checkoutIntro" class="muted">Your bundle ZIP will be checked before payment starts.</p><form id="checkoutForm" class="form"><label>SKU<input id="skuField" name="sku" readonly></label><label>Name<input name="customer_name" required placeholder="Your name"></label><label>Email<input type="email" name="customer_email" required placeholder="you@example.com"></label><label>Phone<input name="customer_phone" placeholder="Optional"></label><label><input type="checkbox" name="accept_terms" required> I accept the Terms and Refund Policy</label><button class="btn btn-primary" type="submit">Pay with PayFast</button></form><p id="checkoutStatus" class="notice"></p></section><aside class="summary"><h3>Order summary</h3><div id="checkoutPrice" class="big-price">—</div><p id="checkoutBadges" class="muted"></p><p><strong>Files:</strong> <span id="filesMeta">—</span></p><p><strong>Delivery:</strong> ZIP + invoice email</p><p><strong>Payment:</strong> PayFast</p></aside></div></div></main><script src="config.js"></script><script src="checkout.js"></script></body></html>
