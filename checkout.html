<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secure Checkout | StudyHub</title>
  <meta name="description" content="Secure StudyHub checkout with PayFast" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html#top" aria-label="StudyHub home"><img class="brand-logo" src="assets/img/studylogo.png" alt="StudyHub logo" /></a>
      <nav class="nav-links">
        <a href="index.html#packages">Bundles</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="detail-main">
    <section class="section">
      <div class="container">
        <a class="back-link" href="index.html#packages">← Back to bundles</a>
        <div class="detail-layout">
          <section class="detail-panel card-surface">
            <span class="eyebrow">Secure checkout</span>
            <h2 id="checkoutTitle">Loading package…</h2>
            <p id="checkoutIntro">Preparing checkout…</p>
            <form id="checkoutForm" class="checkout-form">
              <label>Package SKU<input type="text" id="skuField" name="sku" readonly /></label>
              <label>Full name<input type="text" name="customer_name" required /></label>
              <label>Email address<input type="email" name="customer_email" required /></label>
              <label>Phone number (optional)<input type="text" name="customer_phone" /></label>
              <label>Notes (optional)<textarea rows="4" name="notes" placeholder="Anything special about this order?"></textarea></label>
              <div class="detail-actions">
                <button class="btn btn-primary" type="submit">Continue to PayFast</button>
                <a class="btn btn-secondary" href="index.html#packages">Cancel</a>
              </div>
            </form>
            <p id="checkoutStatus" class="inline-status"></p>
          </section>
          <aside class="detail-panel card-surface product-sidebar">
            <h3 id="summaryTitle">Order summary</h3>
            <div class="product-price" id="checkoutPrice">—</div>
            <div class="badge-row" id="checkoutBadges"></div>
            <div class="detail-meta-list">
              <div class="detail-meta-item"><strong>From year</strong><span id="fromYearMeta">—</span></div>
              <div class="detail-meta-item"><strong>To year</strong><span id="toYearMeta">—</span></div>
              <div class="detail-meta-item"><strong>Included files</strong><span id="filesMeta">—</span></div>
            </div>
            <p class="product-note">After payment, the success page checks backend order status before the delivery link becomes visible.</p>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
