<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Your normal CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <section class="checkout-card">

    <h1>Checkout</h1>

    <!-- IMPORTANT:
         METHOD = POST
         ACTION = Apps Script Web App /exec URL
    -->
    <form
      id="checkoutForm"
      method="POST"
      action="https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec">

      <!-- REQUIRED: tells Apps Script what to do -->
      <input type="hidden" name="action" value="createCheckout">

      <!-- REQUIRED: bundle SKU -->
      <input type="hidden" name="sku" id="skuField">

      <!-- CUSTOMER DETAILS -->
      <label>
        Name
        <input type="text" name="name" id="nameInput" required>
      </label>

      <label>
        Email
        <input type="email" name="email" id="emailInput" required>
      </label>

      <label>
        Phone (optional)
        <input type="tel" name="phone" id="phoneInput">
      </label>

      <label>
        Notes (optional)
        <textarea name="notes" id="notesInput"></textarea>
      </label>

      <!-- SUBMIT -->
      <button type="submit" class="btn-primary">
        Create order
      </button>

    </form>

  </section>

  <!-- Small helper script -->
  <script>
    // Pull SKU from URL (?sku=SH-G10-ALL-2023-SY)
    const params = new URLSearchParams(window.location.search);
    const sku = params.get('sku');

    if (!sku) {
      alert('Missing SKU');
    } else {
      document.getElementById('skuField').value = sku;
    }
  </script>

</body>
</html>
