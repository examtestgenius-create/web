<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />

  <title>StudyHub Checkout</title>
</head>
<body>
  <header class="site-header"><div class="container nav"><a class="brand" href="index.html#top"><img class="brand-logo" src="assets/img/studylogo.svg" alt="StudyHub logo" /></a><nav><a href="index.html#packages">Bundles</a><a href="index.html#contact">Contact</a></nav></div></header>
  <main class="detail-main"><section class="section"><div class="container"><a class="back-link" href="index.html#packages">← Back to bundles</a><div class="detail-layout"><section class="detail-panel card-surface"><span class="eyebrow">Checkout</span><h2 id="checkoutTitle">Loading package…</h2><p id="checkoutIntro">Creating your order…</p><form id="checkoutForm" class="checkout-form"><label>Package SKU<input type="text" id="skuField" name="sku" readonly /></label><label>First name<input type="text" name="name_first" required /></label><label>Last name<input type="text" name="name_last" required /></label><label>Email<input type="email" name="customer_email" required /></label><label>Cell number (optional)<input type="text" name="cell_number" /></label><label>Notes (optional)<textarea rows="4" name="notes" placeholder="Anything special about this order?"></textarea></label><div class="detail-actions"><button class="btn btn-primary" type="submit">Proceed to payment</button><a class="btn btn-secondary" href="index.html#packages">Cancel</a></div></form><p id="checkoutStatus" class="product-note"></p></section><aside class="detail-panel card-surface product-sidebar"><h3>Order summary</h3><div class="product-price" id="checkoutPrice">—</div><div class="badge-row" id="checkoutBadges"></div><div class="detail-meta-list"><div class="detail-meta-item"><strong>From year</strong><span id="fromYearMeta">—</span></div><div class="detail-meta-item"><strong>To year</strong><span id="toYearMeta">—</span></div><div class="detail-meta-item"><strong>Included files</strong><span id="filesMeta">—</span></div></div></aside></div></div></section></main>
  <footer class="site-footer"><div class="container footer-row"><span>© StudyHub</span><span>Secure checkout</span></div></footer>
  <script src="config.js"></script><script src="checkout.js"></script>
</body>
</html>
