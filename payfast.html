<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PayFast Checkout</title>
</head>
<body>

<button onclick="pay()">Pay Now</button>

<script>
async function pay() {

  const res = await fetch(
    'https://script.google.com/macros/s/AKfycbzP1FMuDC92FKnQ0T-DJrMah3b7vsO1rADn4IYq5kjXzu79C4hdu1fyo1vGhxs9K5Vy/exec',
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'createCheckout',
        sku: 'SH-G10-ALL-2022-2026-UB',
        customer_email: 'test@example.com',
        customer_name: 'Test User',
        customer_phone: '0820000000'
      })
    }
  );

  const data = await res.json();
  if (!data.ok) {
    alert(data.error || 'Checkout failed');
    return;
  }

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = data.payfast_url;

  for (const key in data.payfast_payload) {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = data.payfast_payload[key];
    form.appendChild(input);
  }

  document.body.appendChild(form);
  form.submit();
}
</script>

</body>
</html>
