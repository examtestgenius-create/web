<section class="section"><div class="container"><h2>Browse Packs</h2>
<div class="muted">Click <b>Load Packs</b>. (Requires cfg.catalogEndpoint in assets/app.js.)</div>
<div class="actions" style="margin-top:12px"><button class="btn btn-primary" id="load">Load Packs</button></div>
<div class="grid cards" id="grid" style="margin-top:14px"></div>
<div class="muted" id="hint" style="margin-top:10px"></div>
</div></section>

<script src="./assets/app.js"></script>
<script>
(function(){
  const grid=document.getElementById('grid');
  const hint=document.getElementById('hint');
  function moneyCents(c){return 'R'+(Number(c||0)/100).toFixed(0)}
  async function load(){
    grid.innerHTML=''; hint.textContent='';
    if(!window.cfg || !cfg.catalogEndpoint){hint.textContent='Missing backend endpoint. Set cfg.catalogEndpoint in assets/app.js.';return;}
    const url = cfg.catalogEndpoint + (cfg.catalogEndpoint.indexOf('?')>=0?'&':'?') + 'action=products';
    const res = await fetch(url);
    const data = await res.json();
    const products = (data.products||[]).filter(p=>p.hasMemo!==false);
    if(!products.length){hint.textContent='No products returned. Check your Catalog sheet.';return;}
    products.forEach(p=>{
      const card=document.createElement('div'); card.className='card';
      const h3=document.createElement('h3'); h3.style.margin='0'; h3.textContent=p.title;
      const sm=document.createElement('small'); sm.textContent='Grade '+p.grade+' • '+p.subject+' • Memos included';
      const pr=document.createElement('div'); pr.className='price'; pr.textContent=moneyCents(p.price_cents);
      const actions=document.createElement('div'); actions.className='actions'; actions.style.marginTop='10px';
      const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.type='button'; btn.textContent='Add to Cart';
      btn.addEventListener('click',()=>{ window.addToCart({sku:p.sku,title:p.title,price:(Number(p.price_cents||0)/100)}); btn.textContent='Added ✓'; setTimeout(()=>btn.textContent='Add to Cart',800); });
      const go=document.createElement('a'); go.className='btn btn-secondary'; go.href='cart.html'; go.textContent='Checkout';
      actions.appendChild(btn); actions.appendChild(go);
      card.appendChild(h3); card.appendChild(sm); card.appendChild(pr); card.appendChild(actions);
      grid.appendChild(card);
    });
  }
  document.getElementById('load').addEventListener('click', load);
})();
</script>
