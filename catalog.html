<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StudyHub | Catalog</title>
  <meta name="description" content="Browse StudyHub packages by grade, subject, year and type." />
  <link rel="stylesheet" href="assets/css/style.css" />

  <link rel="canonical" href="https://YOUR_USERNAME.github.io/studyhub-site/catalog.html" />
  <meta name="robots" content="index,follow" />
  <meta property="og:site_name" content="StudyHub" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="StudyHub | Catalog" />
  <meta property="og:description" content="Browse StudyHub products by grade, subject, year and package." />
  <meta property="og:image" content="https://YOUR_USERNAME.github.io/studyhub-site/assets/images/hero-study.jpg" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="StudyHub Home">
      <img class="logo" src="assets/images/studylogo.png" alt="StudyHub logo" />
    </a>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="catalog.html" aria-current="page">Browse</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </header>

  <main class="container section">
    <div class="section-head"><h1>Browse Catalog</h1><p>Filter by grade, subject and package. All products are 2022+ and include Paper + Memo pairs.</p></div>

    <div class="filters">
      <div class="field"><label for="gradeFilter">Grade</label><select id="gradeFilter"><option value="">All</option><option value="8">Grade 8</option><option value="9">Grade 9</option><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></div>
      <div class="field"><label for="subjectFilter">Subject</label><select id="subjectFilter"><option value="">All</option></select></div>
      <div class="field"><label for="packageFilter">Package</label><select id="packageFilter"><option value="">All</option><option value="PP">Paper Pair (PP)</option><option value="SS">Single Subject (SS)</option><option value="MB">Master Subject (MB)</option><option value="UB">Ultimate Grade (UB)</option></select></div>
      <div class="field"><label for="yearFilter">Year</label><select id="yearFilter"><option value="">All</option></select></div>
      <div class="field"><label>&nbsp;</label><button id="resetBtn" class="btn btn-soft" type="button">Reset</button></div>
    </div>

    <div id="catalogSummary" class="muted"></div>
    <div id="productGrid" class="product-grid" aria-live="polite"></div>
    <div id="ultimate" class="section"></div>
  </main>

  <footer class="footer">
  <div class="container footer-row">
    <div>
      <img class="logo-sm" src="assets/images/studylogo.png" alt="StudyHub" />
      <p class="muted">Grades 8–12 • 2022 onwards • All provinces included</p>
    </div>
    <div class="footer-links">
      <a href="catalog.html">Catalog</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="sitemap.xml">Sitemap</a>
    </div>
  </div>
  <div class="container"><p class="muted">© <span id="y"></span> StudyHub • Powered by PayFast</p></div>
</footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/catalog.js"></script>
</body>
</html>
