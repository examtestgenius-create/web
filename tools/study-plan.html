
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyHub – Study Plan Generator (Maths + Physical Sciences)</title>
  <meta name="robots" content="index,follow" />
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;margin:0;padding:20px;max-width:900px}
    h1{margin:0 0 8px}
    .muted{color:#6b7280}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    label{font-weight:700;font-size:13px}
    input,select{padding:10px;border:1px solid #e5e7eb;border-radius:10px;width:100%}
    button{padding:10px 14px;border-radius:10px;border:0;background:#2F76FF;color:white;font-weight:800;cursor:pointer}
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:14px}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:left;font-size:14px}
    th{background:#f3f4f6}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#1d4ed8;font-weight:800;font-size:12px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Study Plan Generator</h1>
  <div class="muted">Generate a 2–6 week plan for <b>Maths</b> + <b>Physical Sciences</b>. Print this page after generating.</div>

  <div class="card">
    <div class="row">
      <div>
        <label>Grade</label>
        <select id="grade">
          <option>8</option><option>9</option><option>10</option><option>11</option><option selected>12</option>
        </select>
      </div>
      <div>
        <label>Weeks to plan</label>
        <select id="weeks">
          <option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
        </select>
      </div>
      <div>
        <label>Hours per week</label>
        <select id="hours">
          <option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option>
        </select>
      </div>
      <div>
        <label>Exam/Test date (optional)</label>
        <input id="exam" type="date" />
      </div>
    </div>

    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
      <button onclick="build()">Generate plan</button>
      <button style="background:#111" onclick="window.print()">Print</button>
    </div>
  </div>

  <div id="out" class="card" style="display:none"></div>

<script>
const TOPICS = {
  Maths: {
    8:["Integers & operations","Fractions/percentages","Ratios/rates","Algebra basics","Geometry basics","Data handling"],
    9:["Algebra expand/factor","Equations/inequalities","Functions intro","Similarity","Pythagoras","Probability"],
    10:["Algebra & equations","Functions (lin/quad)","Trig basics","Analytical geometry","Stats","Probability"],
    11:["Functions (exp/hyper)","Trig identities","Geometry proofs","Sequences","Stats","Probability"],
    12:["Functions revision","Trig (graphs/eq)","Geometry proofs","Circle geometry","Probability","Intro calculus"]
  },
  Sci: {
    8:["Motion basics","Forces","Energy","Circuits","Waves","Matter"],
    9:["Graphs in motion","Newton basics","Energy transfer","Series/parallel","Atoms","Magnetism"],
    10:["1D motion","Newton laws","Work/energy","Momentum","Circuits","Bonding/reactions"],
    11:["Projectile motion","Electrostatics","Circuits","Waves","Stoichiometry","Acids/bases"],
    12:["Collisions","Circuits advanced","Electromagnetism","Optics","Equilibrium","Stoichiometry"]
  }
};

function build(){
  const g = Number(document.getElementById('grade').value);
  const w = Number(document.getElementById('weeks').value);
  const hrs = Number(document.getElementById('hours').value);
  const exam = document.getElementById('exam').value;

  const m = TOPICS.Maths[g].slice();
  const s = TOPICS.Sci[g].slice();

  const hrsM = Math.round(hrs/2);
  const hrsS = hrs-hrsM;

  const plan = [];
  for(let i=1;i<=w;i++){
    const mt = m[i % m.length];
    const st = s[i % s.length];
    plan.push({week:i, maths:mt, sci:st, mathsH:hrsM, sciH:hrsS});
  }

  const out = document.getElementById('out');
  out.style.display='block';

  let html = '';
  html += '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:end">';
  html += '<div><h2 style="margin:0">Your Plan <span class="pill">Grade '+g+'</span></h2>';
  html += '<div class="muted">Weeks: '+w+' • Hours/week: '+hrs+(exam? ' • Exam/Test: '+exam:'')+'</div></div>';
  html += '<div class="muted">Tip: Do 1 timed mini-test per subject weekly and mark with memo.</div></div>';

  html += '<table style="margin-top:12px"><thead><tr><th>Week</th><th>Maths focus</th><th>Maths hours</th><th>Sciences focus</th><th>Sciences hours</th></tr></thead><tbody>';
  plan.forEach(p=>{
    html += '<tr><td>'+p.week+'</td><td>'+p.maths+'</td><td>'+p.mathsH+'</td><td>'+p.sci+'</td><td>'+p.sciH+'</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="muted" style="margin-top:10px;font-size:13px">Routine: Learn concept → practise → mark with memo → redo mistakes 24–48h later.</div>';

  out.innerHTML = html;
}
</script>
</body>
</html>
