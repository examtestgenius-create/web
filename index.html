<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyHub | Grade 8–12 Exam Papers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="#top">
      <img src="assets/img/studylogo.png" alt="StudyHub" class="brand-logo">
    </a>
    <nav>
      <a href="#free">Free</a>
      <a href="#packages">Bundles</a>
      <a href="#subjects">Subjects</a>
      <a href="#contact" class="btn btn-sm btn-primary">Contact</a>
    </nav>
  </div>
</header>

<main id="top">

<!-- ✅ FEATURED -->
<section class="section alt" id="featured">
  <div class="container">
    <h2>Popular bundles right now</h2>
    <div id="featuredCards" class="cards three-up"></div>
  </div>
</section>

<!-- ✅ FILTERS -->
<section class="section" id="filters">
  <div class="container filter-bar card-surface">
    <input id="searchInput" type="search" placeholder="Search bundles…">

    <select id="filterType">
      <option value="ALL">All types</option>
    </select>

    <select id="filterSubject">
      <option value="ALL">All subjects</option>
    </select>

    <button id="clearFilters" class="btn btn-secondary">Clear</button>
  </div>
</section>

<!-- ✅ BUNDLES -->
<section class="section" id="packages">
  <div class="container">
    <h2>Browse bundles</h2>
    <p id="catalogMeta">Loading catalog…</p>
    <div id="packageCards" class="cards three-up"></div>
  </div>
</section>

<!-- ✅ CONTACT -->
<section class="section alt" id="contact">
  <div class="container">
    <h2>Need help choosing?</h2>
    <form id="contactForm" class="card-surface">
      <input name="name" placeholder="Name" required>
      <input name="email" type="email" placeholder="Email" required>
      <textarea name="message" placeholder="Grade, subject, year…"></textarea>
      <button class="btn btn-primary">Send</button>
    </form>
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="container footer-row">
    <span>© StudyHub</span>
  </div>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
